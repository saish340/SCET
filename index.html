<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCET - Copyright Status Tag v5</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📜</span>
                <h1>SCET</h1>
                <span class="tagline">Copyright Status Tag</span>
            </div>
        </header>

        <main class="main-content">
            <section class="hero">
                <h2>AI-Powered Copyright Analysis</h2>
                <p>Search for any creative work and get instant copyright status</p>
            </section>

            <section id="search" class="search-section">
                <div class="search-box">
                    <div class="search-input-container">
                        <input type="text" id="searchInput" placeholder="Search (e.g., Harry Potter, Romeo and Juliet)">
                        <button id="searchBtn" class="search-btn">🔍 Search</button>
                    </div>
                    <div class="search-options">
                        <select id="contentType"><option value="">All Types</option><option value="book">Books</option></select>
                        <select id="jurisdiction"><option value="US">🇺🇸 US</option><option value="IN">🇮🇳 India</option></select>
                    </div>
                </div>
                <div id="loading" class="loading hidden"><div class="spinner"></div><span>Searching...</span></div>
                <div id="results" class="search-results hidden"><h3>Results</h3><div id="resultsList"></div></div>
                <div id="tagSection" class="smart-tag-section hidden"><h3>Copyright Status</h3><div id="tagContainer"></div></div>
            </section>
        </main>

        <footer class="footer"><p>© 2026 SCET</p></footer>
    </div>

<script>
(function(){
    var API = '/api/v1';
    var searchBtn = document.getElementById('searchBtn');
    var searchInput = document.getElementById('searchInput');
    var loading = document.getElementById('loading');
    var results = document.getElementById('results');
    var resultsList = document.getElementById('resultsList');
    var tagSection = document.getElementById('tagSection');
    var tagContainer = document.getElementById('tagContainer');
    var jurisdiction = document.getElementById('jurisdiction');
    
    console.log('SCET v4 loaded');
    
    searchBtn.onclick = search;
    searchInput.onkeypress = function(e){ if(e.key==='Enter') search(); };
    
    function search(){
        var q = searchInput.value.trim();
        if(!q){ alert('Enter search term'); return; }
        
        loading.className = 'loading';
        results.className = 'search-results hidden';
        tagSection.className = 'smart-tag-section hidden';
        
        fetch(API + '/search?q=' + encodeURIComponent(q) + '&jurisdiction=' + jurisdiction.value)
            .then(function(r){ return r.json(); })
            .then(function(data){
                loading.className = 'loading hidden';
                showResults(data.results || []);
            })
            .catch(function(err){
                loading.className = 'loading hidden';
                resultsList.innerHTML = '<p style="color:red">Error: ' + err.message + '</p>';
                results.className = 'search-results';
            });
    }
    
    function showResults(items){
        if(items.length === 0){
            resultsList.innerHTML = '<p>No results found</p>';
        } else {
            var html = '';
            for(var i=0; i<items.length; i++){
                var r = items[i];
                html += '<div class="result-item" data-i="'+i+'">';
                html += '<div class="result-info"><div class="result-title">'+esc(r.title)+'</div>';
                html += '<div class="result-meta">'+(r.creator||'Unknown')+' • '+(r.publication_year||'?')+' • '+r.source+'</div></div>';
                html += '<div class="result-score"><span class="status-badge">'+r.copyright_status+'</span></div></div>';
            }
            resultsList.innerHTML = html;
            window._results = items;
            
            var els = document.querySelectorAll('.result-item');
            for(var j=0; j<els.length; j++){
                els[j].onclick = function(){
                    var idx = parseInt(this.getAttribute('data-i'));
                    getTag(window._results[idx]);
                };
            }
        }
        results.className = 'search-results';
    }
    
    function getTag(item){
        loading.className = 'loading';
        var url = API + '/tag/detailed?title=' + encodeURIComponent(item.title) + 
                  '&year=' + (item.publication_year||'') + 
                  '&jurisdiction=' + jurisdiction.value;
        
        fetch(url)
            .then(function(r){ return r.json(); })
            .then(function(data){
                loading.className = 'loading hidden';
                showTag(data.tag);
            })
            .catch(function(err){
                loading.className = 'loading hidden';
                tagContainer.innerHTML = '<p style="color:red">Error: ' + err.message + '</p>';
                tagSection.className = 'smart-tag-section';
            });
    }
    
    function showTag(tag){
        var color = tag.status === 'PUBLIC_DOMAIN' ? 'green' : 'red';
        var emoji = tag.status === 'PUBLIC_DOMAIN' ? '🌍' : '🔒';
        tagContainer.innerHTML = 
            '<div class="smart-tag status-'+color+'">' +
            '<div class="tag-header"><span class="tag-emoji">'+emoji+'</span><span class="tag-status">'+tag.status+'</span></div>' +
            '<div class="tag-title">'+esc(tag.title)+'</div>' +
            '<div class="tag-timeline">⏱ '+(tag.expiry_info||tag.expiry_timeline||'Unknown')+'</div>' +
            '<div class="tag-uses"><strong>Allowed:</strong> '+(tag.allowed_uses||[]).join(', ')+'</div>' +
            '<div class="tag-confidence">🎯 Confidence: '+Math.round((tag.confidence||0.8)*100)+'%</div>' +
            '</div>';
        tagSection.className = 'smart-tag-section';
        tagSection.scrollIntoView({behavior:'smooth'});
    }
    
    function esc(s){ 
        if(!s) return ''; 
        var d = document.createElement('div'); 
        d.textContent = s; 
        return d.innerHTML; 
    }
})();
</script>
</body>
</html>
